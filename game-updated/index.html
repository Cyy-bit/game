<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>資訊迷霧：誰能看穿市場？</title>
  <style>
    :root {
      --bg-a: #050615;
      --bg-b: #101142;
      --bg-c: #2c0a49;
      --panel: rgba(9, 13, 35, 0.86);
      --panel-soft: rgba(21, 28, 67, 0.82);
      --text: #f8fbff;
      --muted: #aeb8d8;
      --cyan: #2ee9ff;
      --pink: #ff4bd8;
      --gold: #ffca3a;
      --orange-card: #ffad31;
      --purple-card: #c6a2ff;
      --deep-card: #39168a;
      --danger: #ff4c68;
      --good: #46ff9d;
      --line: rgba(91, 231, 255, 0.35);
      --shadow-cyan: 0 0 20px rgba(46, 233, 255, 0.28);
      --shadow-pink: 0 0 22px rgba(255, 75, 216, 0.22);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--text);
      font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", system-ui, sans-serif;
      font-weight: 800;
      background:
        linear-gradient(90deg, rgba(46, 233, 255, 0.08) 1px, transparent 1px),
        linear-gradient(0deg, rgba(255, 75, 216, 0.07) 1px, transparent 1px),
        linear-gradient(135deg, var(--bg-a), var(--bg-b) 50%, var(--bg-c));
      background-size: 44px 44px, 44px 44px, auto;
      min-height: 100vh;
      letter-spacing: 0;
    }

    button, input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
      color: var(--text);
      border-radius: 8px;
      padding: 13px 16px;
      background: linear-gradient(135deg, #00b7ff, #a543ff 55%, #ff3bc8);
      box-shadow: var(--shadow-cyan), inset 0 0 0 2px rgba(255, 255, 255, 0.18);
      transition: transform 0.12s ease, filter 0.12s ease;
      min-height: 52px;
    }

    button:hover { transform: translateY(-1px); filter: brightness(1.12); }
    button:disabled { cursor: not-allowed; opacity: 0.45; filter: grayscale(0.5); transform: none; }

    input {
      width: 100%;
      min-height: 48px;
      border-radius: 8px;
      border: 2px solid rgba(46, 233, 255, 0.35);
      background: rgba(2, 6, 22, 0.7);
      color: var(--text);
      padding: 8px 10px;
      text-align: center;
      font-size: 18px;
      outline: none;
    }

    input:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px rgba(46, 233, 255, 0.15);
    }

    .app {
      width: min(1680px, calc(100% - 28px));
      margin: 0 auto;
      padding: 18px 0 44px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: center;
      padding: 16px;
      margin-bottom: 16px;
      border: 2px solid rgba(46, 233, 255, 0.38);
      background: rgba(5, 8, 24, 0.92);
      box-shadow: var(--shadow-cyan);
      backdrop-filter: blur(14px);
      border-radius: 0 0 8px 8px;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 4vw, 58px);
      line-height: 1.05;
      text-shadow: 0 0 12px rgba(46, 233, 255, 0.55), 0 0 24px rgba(255, 75, 216, 0.28);
    }

    .status {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 10px;
      min-width: min(560px, 100%);
    }

    .status-pill {
      border: 2px solid rgba(255, 255, 255, 0.18);
      background: rgba(25, 32, 78, 0.85);
      border-radius: 999px;
      padding: 10px 16px;
      font-size: 20px;
      box-shadow: inset 0 0 15px rgba(46, 233, 255, 0.08);
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) minmax(390px, 0.72fr);
      gap: 16px;
      align-items: start;
    }

    .main-column,
    .side-column {
      display: grid;
      gap: 16px;
    }

    .section {
      border: 2px solid var(--line);
      background: var(--panel);
      box-shadow: var(--shadow-cyan), var(--shadow-pink);
      border-radius: 8px;
      padding: 18px;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: center;
      margin: 0 0 14px;
      font-size: clamp(24px, 2.2vw, 36px);
      color: #ffffff;
      text-shadow: 0 0 12px rgba(46, 233, 255, 0.45);
    }

    .subtle {
      color: var(--muted);
      font-size: 16px;
      line-height: 1.55;
    }

    .event-hero {
      min-height: 290px;
      display: grid;
      place-items: center;
      text-align: center;
      border: 4px solid rgba(46, 233, 255, 0.7);
      border-radius: 8px;
      padding: 34px;
      background:
        linear-gradient(rgba(3, 7, 24, 0.78), rgba(8, 11, 38, 0.86)),
        linear-gradient(90deg, rgba(46, 233, 255, 0.12), rgba(255, 75, 216, 0.12)),
        linear-gradient(145deg, #030612, #0c1748 65%, #18052c);
      box-shadow: 0 0 34px rgba(46, 233, 255, 0.35), inset 0 0 40px rgba(46, 233, 255, 0.11);
    }

    .event-hero h2 {
      margin: 0 0 14px;
      font-size: clamp(54px, 8vw, 118px);
      line-height: 0.9;
      color: #ffffff;
      text-shadow: 0 0 10px var(--cyan), 0 0 34px var(--pink);
    }

    .event-hero p {
      max-width: 1100px;
      margin: 0;
      font-size: clamp(21px, 2.2vw, 34px);
      line-height: 1.55;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .name-grid,
    .player-grid,
    .card-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }

    .product-grid,
    .hidden-points {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 14px;
    }

    .name-box {
      display: grid;
      gap: 8px;
      color: var(--muted);
      font-size: 16px;
    }

    .board-card {
      position: relative;
      border-radius: 8px;
      padding: 16px;
      min-height: 170px;
      border: 5px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.34), inset 0 0 0 2px rgba(255, 255, 255, 0.11);
      overflow: hidden;
    }

    .board-card::after {
      content: "";
      position: absolute;
      inset: 9px;
      border: 2px dashed rgba(255, 255, 255, 0.22);
      border-radius: 6px;
      pointer-events: none;
    }

    .product-card {
      background: linear-gradient(150deg, #4a18a7, #261066 66%, #13072c);
      border-color: rgba(198, 162, 255, 0.58);
      min-height: 210px;
    }

    .player-card {
      background: linear-gradient(150deg, rgba(12, 23, 72, 0.96), rgba(41, 18, 93, 0.95));
      border-color: rgba(46, 233, 255, 0.45);
    }

    .board-card h3 {
      position: relative;
      z-index: 1;
      margin: 0 0 10px;
      font-size: 26px;
      line-height: 1.16;
    }

    .board-card p,
    .board-card .meta {
      position: relative;
      z-index: 1;
    }

    .product-desc {
      min-height: 76px;
      color: #dbcfff;
      line-height: 1.45;
      font-size: 17px;
      margin: 0 0 14px;
    }

    .price-tag {
      display: inline-flex;
      align-items: center;
      min-height: 40px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255, 202, 58, 0.16);
      border: 2px solid rgba(255, 202, 58, 0.55);
      color: #fff1a8;
      font-size: 18px;
    }

    .stat-list {
      position: relative;
      z-index: 1;
      display: grid;
      gap: 6px;
      font-size: 18px;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 5px;
    }

    .cash-negative { color: var(--danger); text-shadow: 0 0 10px rgba(255, 76, 104, 0.5); }
    .gain { color: var(--good); }
    .loss { color: var(--danger); }
    .flat { color: var(--muted); }

    .event-panel {
      border-radius: 8px;
      border: 3px solid rgba(46, 233, 255, 0.55);
      background: linear-gradient(145deg, rgba(4, 10, 31, 0.95), rgba(12, 18, 55, 0.95));
      padding: 18px;
      box-shadow: inset 0 0 34px rgba(46, 233, 255, 0.1);
    }

    .event-panel h3 {
      margin: 0 0 10px;
      font-size: 34px;
      color: #ffffff;
    }

    .event-panel p {
      margin: 0;
      font-size: 22px;
      line-height: 1.62;
    }

    .hidden-points {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-top: 14px;
    }

    .point-box {
      border-radius: 8px;
      border: 2px solid rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.08);
      padding: 12px;
      text-align: center;
      font-size: 20px;
    }

    .draw-card {
      color: #1b0e05;
      min-height: 220px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
    }

    .draw-card.info {
      background: linear-gradient(145deg, #e3caff, var(--purple-card));
      border-color: #efe2ff;
    }

    .draw-card.point {
      background: linear-gradient(145deg, #fff2a7, #ffca3a 58%, #ff9f1c);
      border-color: #fff6c7;
    }

    .draw-card.product {
      color: #fff;
      background: linear-gradient(145deg, #5e2bd1, var(--deep-card));
      border-color: #b99cff;
    }

    .draw-card.fate {
      background: linear-gradient(145deg, #ffd56c, var(--orange-card));
      border-color: #ffe9b0;
    }

    .card-owner {
      position: relative;
      z-index: 1;
      font-size: 20px;
      opacity: 0.82;
    }

    .card-type {
      position: relative;
      z-index: 1;
      font-size: 30px;
      line-height: 1.1;
    }

    .card-text {
      position: relative;
      z-index: 1;
      font-size: 20px;
      line-height: 1.35;
    }

    .private-note {
      position: relative;
      z-index: 1;
      display: inline-block;
      border-radius: 999px;
      padding: 7px 10px;
      font-size: 15px;
      background: rgba(0, 0, 0, 0.18);
      color: inherit;
    }

    .timer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      border: 3px solid rgba(255, 75, 216, 0.45);
      background: rgba(255, 75, 216, 0.1);
      padding: 14px 18px;
      border-radius: 8px;
      font-size: 28px;
    }

    .timer strong {
      font-size: clamp(48px, 7vw, 92px);
      line-height: 1;
      text-shadow: 0 0 20px rgba(255, 75, 216, 0.45);
    }

    .adjust-grid {
      display: grid;
      gap: 14px;
    }

    .adjust-player {
      border-radius: 8px;
      border: 2px solid rgba(255, 255, 255, 0.14);
      background: var(--panel-soft);
      padding: 14px;
    }

    .adjust-player h3 {
      margin: 0 0 10px;
      font-size: 24px;
    }

    .adjust-inputs {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
    }

    .field label {
      display: block;
      color: var(--muted);
      margin-bottom: 5px;
      font-size: 15px;
    }

    .message-box {
      margin-top: 12px;
      min-height: 34px;
      color: #fff1a8;
      font-size: 18px;
      line-height: 1.45;
    }

    .leader-row {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 13px 14px;
      margin-bottom: 9px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      border: 2px solid rgba(255, 255, 255, 0.1);
      font-size: 22px;
    }

    .leader-row.first {
      color: #fff6bc;
      border-color: rgba(255, 202, 58, 0.8);
      box-shadow: 0 0 22px rgba(255, 202, 58, 0.25);
      background: rgba(255, 202, 58, 0.13);
    }

    .market-note {
      margin-top: 14px;
      border: 2px solid rgba(255, 202, 58, 0.38);
      border-radius: 8px;
      background: rgba(255, 202, 58, 0.1);
      padding: 12px;
      font-size: 18px;
      line-height: 1.5;
    }

    .record-list {
      display: grid;
      gap: 12px;
      max-height: 620px;
      overflow: auto;
      padding-right: 4px;
    }

    .record-item {
      border-radius: 8px;
      border: 2px solid rgba(46, 233, 255, 0.2);
      background: rgba(255, 255, 255, 0.07);
      padding: 14px;
      font-size: 17px;
      line-height: 1.55;
    }

    .record-item h3 {
      margin: 0 0 8px;
      font-size: 22px;
    }

    .final-panel {
      border-color: rgba(255, 202, 58, 0.65);
      box-shadow: 0 0 30px rgba(255, 202, 58, 0.22), var(--shadow-pink);
    }

    .final-panel p {
      font-size: 21px;
      line-height: 1.65;
    }

    .history-block {
      margin-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      padding-top: 10px;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.5;
    }

    .compact-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    .ghost-button {
      background: rgba(255, 255, 255, 0.09);
      border: 2px solid rgba(46, 233, 255, 0.38);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06);
    }

    .danger-button {
      background: linear-gradient(135deg, #ff375f, #7a1cff);
    }

    .empty {
      color: var(--muted);
      font-size: 20px;
      line-height: 1.5;
      padding: 12px 0;
    }

    @media (max-width: 1200px) {
      .grid,
      .topbar {
        grid-template-columns: 1fr;
      }

      .status { justify-content: flex-start; }
      .controls { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .name-grid,
      .product-grid,
      .player-grid,
      .card-grid,
      .hidden-points,
      .adjust-inputs {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 720px) {
      .app { width: min(100% - 18px, 1680px); }
      .section { padding: 14px; }
      .controls,
      .name-grid,
      .product-grid,
      .player-grid,
      .card-grid,
      .hidden-points,
      .adjust-inputs,
      .compact-actions {
        grid-template-columns: 1fr;
      }
      .timer { display: grid; text-align: center; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1>資訊迷霧：誰能看穿市場？</h1>
      <div class="status">
        <div class="status-pill">目前回合：<span id="roundLabel">尚未開始</span></div>
        <div class="status-pill">目前階段：<span id="stageLabel">準備中</span></div>
      </div>
    </header>

    <main class="grid">
      <div class="main-column">
        <section class="section">
          <h2 class="section-title">主持人流程按鈕</h2>
          <div class="controls">
            <button id="initBtn">初始化遊戲</button>
            <button id="setNamesBtn">設定玩家名稱</button>
            <button id="showBigEventBtn">顯示大事件</button>
            <button id="startRoundBtn">開始第 1 輪</button>
            <button id="drawEventBtn">抽小事件</button>
            <button id="togglePointsBtn">查看本輪漲跌</button>
            <button id="drawCardsBtn">抽卡</button>
            <button id="timerBtn">開始 3 分鐘討論倒數</button>
            <button id="applyAdjustmentsBtn">套用投資調整</button>
            <button id="settleBtn">結算本輪</button>
            <button id="nextRoundBtn">下一輪</button>
            <button id="endGameBtn">結束遊戲</button>
            <button id="resetBtn" class="danger-button">重置遊戲</button>
          </div>
          <div id="systemMessage" class="message-box"></div>
        </section>

        <section class="section">
          <h2 class="section-title">設定玩家名稱</h2>
          <div id="nameInputs" class="name-grid"></div>
        </section>

        <section class="section">
          <div id="bigEvent" class="event-hero">
            <div>
              <h2>大事件</h2>
              <p>按下「顯示大事件」開始投影開場劇情。</p>
            </div>
          </div>
        </section>

        <section class="section">
          <h2 class="section-title">玩家資產區</h2>
          <div id="playersArea" class="player-grid"></div>
        </section>

        <section class="section">
          <h2 class="section-title">商品區</h2>
          <div id="productsArea" class="product-grid"></div>
        </section>

        <section class="section">
          <h2 class="section-title">小事件區</h2>
          <div id="smallEventArea" class="event-panel">
            <h3>尚未抽出小事件</h3>
            <p>每輪開始後，請按「抽小事件」。玩家只看新聞版本；隱藏漲跌由主持人控制顯示。</p>
          </div>
        </section>

        <section class="section">
          <h2 class="section-title">抽卡區</h2>
          <div id="cardsArea" class="card-grid"></div>
        </section>

        <section class="section">
          <h2 class="section-title">討論階段</h2>
          <div class="timer">
            <span>3 分鐘倒數</span>
            <strong id="timerDisplay">03:00</strong>
            <span class="subtle">可討論、合作、說服、隱藏資訊與發布謠言</span>
          </div>
        </section>

        <section class="section">
          <h2 class="section-title">投資調整區</h2>
          <p class="subtle">輸入正數代表買入，負數代表賣出。每 1 單位成本或賣出價格都是 5 點。</p>
          <div id="adjustmentsArea" class="adjust-grid"></div>
        </section>
      </div>

      <aside class="side-column">
        <section class="section">
          <h2 class="section-title">排行榜</h2>
          <div id="leaderboardArea"></div>
        </section>

        <section class="section">
          <h2 class="section-title">結算紀錄區</h2>
          <div id="recordsArea" class="record-list"></div>
        </section>

        <section id="finalArea" class="section final-panel" style="display: none;">
          <h2 class="section-title">遊戲結束</h2>
          <div id="finalContent"></div>
        </section>
      </aside>
    </main>
  </div>

  <script>
    // =============================
    // 可修改資料區：商品、事件、卡牌
    // =============================

    const UNIT_PRICE = 5;
    const INITIAL_CASH = 50;
    const MAX_ROUNDS = 5;

    const bigEventText = `AI 熱潮與多資產輪動

全球市場進入新一波 AI 投資熱潮。大型企業積極投入晶片、資料中心、自動化、智慧製造與能源效率升級，投資人開始追逐高成長題材。
但同時，市場也開始思考 AI 投資是否過熱、利率是否維持高檔、資金是否轉向公債、黃金或虛擬貨幣等其他資產。有人認為這是新一波科技革命，也有人擔心市場已經過度樂觀，資金隨時可能出現輪動。`;

    const products = [
  {
    key: "chip",
    name: "晶片巨人",
    desc: "代表半導體、AI 晶片、先進製程與高科技供應鏈。AI 熱潮時可能受惠，但也容易受到估值、利率與景氣預期影響。"
  },
  {
    key: "robot",
    name: "機器人",
    desc: "代表自動化、人形機器人、智慧製造與 AI 實體應用。題材想像空間大，波動也較高。"
  },
  {
    key: "esg",
    name: "ESG 轉型",
    desc: "代表綠能、節能設備、低碳轉型、永續投資與能源效率升級。受政策、補助與長期資金影響。"
  },
  {
    key: "bond",
    name: "公債",
    desc: "代表債券、利率與防禦型資產。市場擔心風險時可能受青睞；但若利率上升，公債價格可能下跌。"
  },
  {
    key: "crypto",
    name: "虛擬貨幣",
    desc: "代表比特幣、加密資產與高風險資金行情。市場風險偏好上升時可能大漲，但遇到利率上升、監管或恐慌時也可能大跌。"
  },
  {
    key: "gold",
    name: "黃金",
    desc: "代表避險資產、抗通膨與市場不確定性。當市場恐慌、地緣風險或通膨壓力上升時可能受惠；當風險偏好回升時可能轉弱。"
  }
];

    // 小事件資料：若要增修事件，保持 points 使用商品 key 即可。
    const roundEvents = {
  1: [

    let state = createInitialState();
    let timerId = null;
    let remainingSeconds = 180;

    function createInitialState() {
      return {
        round: 0,
        stage: "準備中",
        bigEventVisible: false,
        currentEvent: null,
        pointsVisible: false,
        cardsDrawn: false,
        settledRounds: {},
        records: [],
        players: Array.from({ length: 4 }, (_, index) => ({
          id: index + 1,
          name: `玩家 ${index + 1}`,
          cash: INITIAL_CASH,
          holdings: products.reduce((acc, product) => ({ ...acc, [product.key]: 0 }), {}),
          lastProfit: 0,
          cards: [],
          history: []
        }))
      };
    }

    // =============================
    // 共用工具
    // =============================

    const $ = (id) => document.getElementById(id);
    const productName = (key) => products.find((product) => product.key === key).name;
    const signed = (value) => value > 0 ? `+${value}` : `${value}`;
    const classByNumber = (value) => value > 0 ? "gain" : value < 0 ? "loss" : "flat";
    const randomItem = (items) => items[Math.floor(Math.random() * items.length)];
    const shuffle = (items) => [...items].sort(() => Math.random() - 0.5);

    function totalAssets(player) {
      const holdingsValue = products.reduce((sum, product) => sum + player.holdings[product.key] * UNIT_PRICE, 0);
      return player.cash + holdingsValue;
    }

    function setStage(stage) {
      state.stage = stage;
      render();
    }

    function setMessage(message, isError = false) {
      const box = $("systemMessage");
      box.textContent = message;
      box.style.color = isError ? "var(--danger)" : "#fff1a8";
    }

    function resetAdjustInputs() {
      state.players.forEach((player) => {
        products.forEach((product) => {
          const input = document.querySelector(`[data-adjust="${player.id}-${product.key}"]`);
          if (input) input.value = 0;
        });
      });
    }

    function clearTimer() {
      if (timerId) clearInterval(timerId);
      timerId = null;
      remainingSeconds = 180;
      $("timerDisplay").textContent = "03:00";
    }

    // =============================
    // 遊戲動作
    // =============================

    function initializeGame() {
      const existingNames = [...document.querySelectorAll("[data-name-input]")].map((input) => input.value.trim());
      state = createInitialState();
      state.players.forEach((player, index) => {
        if (existingNames[index]) player.name = existingNames[index];
      });
      clearTimer();
      setMessage("遊戲已初始化。可先設定玩家名稱，接著顯示大事件並輸入初始投資。");
      render();
    }

    function applyPlayerNames() {
      state.players.forEach((player, index) => {
        const input = document.querySelector(`[data-name-input="${index}"]`);
        player.name = input.value.trim() || `玩家 ${index + 1}`;
      });
      setMessage("玩家名稱已更新。");
      render();
    }

      state.stage = "大事件";
      setMessage("大事件已顯示。請主持人帶入市場背景。");
      render();
    }

    function startRound() {
      if (state.round >= MAX_ROUNDS) {
        setMessage("已經完成第 5 輪，可結束遊戲。", true);
        return;
      }
      state.round += 1;
      state.currentEvent = null;
      state.pointsVisible = false;
      state.cardsDrawn = false;
      state.players.forEach((player) => {
        player.lastProfit = 0;
        player.cards = [];
      });
      clearTimer();
      resetAdjustInputs();
      setStage(`第 ${state.round} 輪開始`);
      setMessage(`第 ${state.round} 輪已開始。請抽小事件。`);
    }

    function drawSmallEvent() {
      if (!state.round) {
        setMessage("請先開始第 1 輪。", true);
        return;
      }
      if (state.currentEvent) {
        setMessage("本輪已抽過小事件。若要重新抽，請先進入下一輪或重置。", true);
        return;
      }
      state.currentEvent = randomItem(roundEvents[state.round]);
      state.pointsVisible = false;
      setStage(`第 ${state.round} 輪：新聞發布`);
      setMessage("已抽出本輪小事件。");
      render();
    }

    function togglePoints() {
      if (!state.currentEvent) {
        setMessage("尚未抽出本輪小事件。", true);
        return;
      }
      state.pointsVisible = !state.pointsVisible;
      setMessage(state.pointsVisible ? "主持人漲跌資訊已顯示。" : "本輪漲跌已隱藏。");
      render();
    }

    function drawCards() {
      if (!state.currentEvent) {
        setMessage("請先抽小事件，資訊卡才會根據本輪實際方向產生。", true);
        return;
      }
      if (state.cardsDrawn) {
        setMessage("本輪已抽過卡。", true);
        return;
      }

      const roundCardTypes = shuffle(["info", "product", "fate", "point"]);
      state.players.forEach((player, index) => {
        const type = roundCardTypes[index];
        const card = type === "info" ? createInfoCard()
          : type === "point" ? createPointCard()
          : type === "product" ? createProductCard(player)
          : createFateCard(player);
        player.cards = [card];
        player.history.push(`第 ${state.round} 輪抽到：${card.title}。${card.summary}`);
      });

      state.cardsDrawn = true;
      setStage(`第 ${state.round} 輪：抽卡階段`);
      setMessage("四位玩家已各抽一張卡；本輪固定包含資訊卡、商品卡、命運卡、點數卡各一張。");
      render();
    }

    function createInfoCard() {
      const product = randomItem(products);
      const point = state.currentEvent.points[product.key];
      const direction = point > 0 ? "可能上漲" : point < 0 ? "可能下跌" : "可能持平";

      return {
        type: "info",
        title: "資訊卡",
        text: `你得知：「${product.name}」本輪${direction}。`,
        summary: `得知 ${product.name} 本輪方向。`,
        note: "請主持人私下告知該玩家"
      };
    }

    function createPointCard() {
      const product = randomItem(products);
      const point = state.currentEvent.points[product.key];

      return {
        type: "point",
        title: "點數卡",
        text: `你得知：「${product.name}」本輪為 ${signed(point)} 點。`,
        summary: `得知 ${product.name} 本輪點數。`,
        note: "請主持人私下告知該玩家"
      };
    }

    function createProductCard(player) {
      const product = randomItem(products);
      const amount = Math.floor(Math.random() * 3) + 1;
      player.holdings[product.key] += amount;
      return {
        type: "product",
        title: "商品卡",
        text: `你獲得「${product.name}」${amount} 單位。`,
        summary: `獲得 ${product.name} ${amount} 單位。`,
        note: "不公開，請主持人私下記錄；系統已自動增加"
      };
    }

    function createFateCard(player) {
      const fate = randomItem(interactiveFates);
      return {
        type: "fate",
        title: `命運卡：${fate.title}`,
        text: fate.text,
        summary: `互動效果：${fate.title}。`,
        note: "互動型命運卡，請主持人手動處理"
      };
    }

    function startTimer() {
      clearTimer();
      state.stage = `第 ${state.round || 1} 輪：討論階段`;
      timerId = setInterval(() => {
        remainingSeconds -= 1;
        const minutes = String(Math.floor(remainingSeconds / 60)).padStart(2, "0");
        const seconds = String(remainingSeconds % 60).padStart(2, "0");
        $("timerDisplay").textContent = `${minutes}:${seconds}`;
        if (remainingSeconds <= 0) {
          clearTimer();
          $("timerDisplay").textContent = "00:00";
          setMessage("討論時間結束，請進入投資調整。");
        }
      }, 1000);
      setMessage("3 分鐘討論倒數已開始。");
      render();
    }

    function applyAdjustments() {
      const phaseLabel = state.round ? `第 ${state.round} 輪` : "初始投資";

      const changes = [];
      for (const player of state.players) {
        const proposed = {};
        for (const product of products) {
          const input = document.querySelector(`[data-adjust="${player.id}-${product.key}"]`);
          const value = Number.parseInt(input.value || "0", 10);
          if (!Number.isFinite(value)) {
            setMessage(`${player.name} 的 ${product.name} 輸入不是有效數字。`, true);
            return;
          }
          proposed[product.key] = value;
        }

        const buyCost = products.reduce((sum, product) => sum + Math.max(0, proposed[product.key]) * UNIT_PRICE, 0);
        const sellGain = products.reduce((sum, product) => sum + Math.max(0, -proposed[product.key]) * UNIT_PRICE, 0);

        if (player.cash < buyCost) {
          setMessage(`${player.name} 現金不足，無法買入總成本 ${buyCost} 點的商品。`, true);
          return;
        }

        for (const product of products) {
          if (player.holdings[product.key] + proposed[product.key] < 0) {
            setMessage(`${player.name} 的 ${product.name} 持有單位不足，不能賣出 ${Math.abs(proposed[product.key])} 單位。`, true);
            return;
          }
        }

        changes.push({ player, proposed, buyCost, sellGain });
      }

      changes.forEach(({ player, proposed, buyCost, sellGain }) => {
        products.forEach((product) => {
          player.holdings[product.key] += proposed[product.key];
        });
        player.cash = player.cash - buyCost + sellGain;

        const detail = products
          .filter((product) => proposed[product.key] !== 0)
          .map((product) => `${productName(product.key)} ${signed(proposed[product.key])}`)
          .join("、") || "未調整";
        player.history.push(`${phaseLabel}投資調整：${detail}。`);
      });

      resetAdjustInputs();
      setStage(state.round ? `第 ${state.round} 輪：投資調整完成` : "初始投資完成");
      setMessage(state.round ? "投資調整已套用。" : "初始投資已套用。每 1 單位已自動扣除 5 點。");
      render();
    }

    function settleRound() {
      if (!state.currentEvent) {
        setMessage("請先抽小事件。", true);
        return;
      }
      if (state.settledRounds[state.round]) {
        setMessage(`第 ${state.round} 輪已結算過，不能重複結算。`, true);
        return;
      }

      const playerResults = state.players.map((player) => {
        const profit = products.reduce((sum, product) => {
          return sum + player.holdings[product.key] * state.currentEvent.points[product.key];
        }, 0);
        player.cash += profit;
        player.lastProfit = profit;
        const assetsAfter = totalAssets(player);
        player.history.push(`第 ${state.round} 輪結算：本輪盈虧 ${signed(profit)} 點，回合後總資產 ${assetsAfter} 點。`);
        return { playerName: player.name, profit, assetsAfter };
      });

      state.settledRounds[state.round] = true;
      state.records.push({
        round: state.round,
        event: state.currentEvent,
        playerResults
      });
      state.pointsVisible = true;
      setStage(`第 ${state.round} 輪：結算完成`);
      setMessage(`第 ${state.round} 輪已結算，排行榜已更新。`);
      render();
    }

    function nextRound() {
      if (!state.round) {
        setMessage("請先開始第 1 輪。", true);
        return;
      }
      if (!state.settledRounds[state.round]) {
        setMessage("本輪尚未結算，請先結算本輪。", true);
        return;
      }
      if (state.round >= MAX_ROUNDS) {
        endGame();
        return;
      }
      setMessage(`準備進入第 ${state.round + 1} 輪。請按「開始第 ${state.round + 1} 輪」。`);
      state.stage = "等待下一輪";
      render();
    }

    function endGame() {
      if (state.round < MAX_ROUNDS) {
        const confirmEnd = window.confirm("遊戲尚未到第 5 輪，確定要提前結束嗎？");
        if (!confirmEnd) return;
      }
      state.stage = "遊戲結束";
      state.pointsVisible = true;
      setMessage("遊戲結束，請查看最終排行榜與講評文字。");
      render();
      $("finalArea").scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function resetGame() {
      const shouldReset = window.confirm("確定要重置整場遊戲嗎？所有紀錄會清空。");
      if (!shouldReset) return;
      initializeGame();
    }

    // =============================
    // 畫面渲染
    // =============================

    function render() {
      $("roundLabel").textContent = state.round ? `第 ${state.round} / ${MAX_ROUNDS} 輪` : "尚未開始";
      $("stageLabel").textContent = state.stage;
      $("startRoundBtn").textContent = `開始第 ${Math.min(state.round + 1, MAX_ROUNDS)} 輪`;
      $("togglePointsBtn").textContent = state.pointsVisible ? "隱藏本輪漲跌" : "查看本輪漲跌";

      renderNames();
      renderBigEvent();
      renderPlayers();
      renderProducts();
      renderSmallEvent();
      renderCards();
      renderAdjustments();
      renderLeaderboard();
      renderRecords();
      renderFinal();
      updateButtonStates();
    }

    function renderNames() {
      $("nameInputs").innerHTML = state.players.map((player, index) => `
        <div class="name-box">
          <label>第 ${index + 1} 位玩家</label>
          <input data-name-input="${index}" value="${escapeHtml(player.name)}" />
        </div>
      `).join("");
    }

    function renderBigEvent() {
      $("bigEvent").innerHTML = `
        <div>
          <h2>大事件</h2>
          <p>${state.bigEventVisible ? escapeHtml(bigEventText).replace(/\n/g, "<br>") : "按下「顯示大事件」開始投影開場劇情。"}</p>
        </div>
      `;
    }

    function renderPlayers() {
      $("playersArea").innerHTML = state.players.map((player) => {
        const cashClass = player.cash < 0 ? "cash-negative" : "";
        const profitClass = classByNumber(player.lastProfit);
        const holdingRows = products.map((product) => `
          <div class="stat-row"><span>${product.name}</span><strong>${player.holdings[product.key]} 單位</strong></div>
        `).join("");

        return `
          <article class="board-card player-card">
            <h3>${escapeHtml(player.name)}</h3>
            <div class="stat-list">
              <div class="stat-row"><span>現金</span><strong class="${cashClass}">${player.cash} 點</strong></div>
              ${holdingRows}
              <div class="stat-row"><span>總資產</span><strong>${totalAssets(player)} 點</strong></div>
              <div class="stat-row"><span>本輪盈虧</span><strong class="${profitClass}">${signed(player.lastProfit)} 點</strong></div>
            </div>
          </article>
        `;
      }).join("");
    }

    function renderProducts() {
      $("productsArea").innerHTML = products.map((product) => `
        <article class="board-card product-card">
          <h3>${product.name}</h3>
          <p class="product-desc">${product.desc}</p>
          <span class="price-tag">每單位 5 點</span>
        </article>
      `).join("");
    }

    function renderSmallEvent() {
      if (!state.currentEvent) {
        $("smallEventArea").innerHTML = `
          <h3>尚未抽出小事件</h3>
          <p>每輪開始後，請按「抽小事件」。玩家只看新聞版本；隱藏漲跌由主持人控制顯示。</p>
        `;
        return;
      }

      const points = products.map((product) => {
        const point = state.currentEvent.points[product.key];
        return `<div class="point-box"><div>${product.name}</div><strong class="${classByNumber(point)}">${signed(point)} 點</strong></div>`;
      }).join("");

      $("smallEventArea").innerHTML = `
        <h3>事件資訊</h3>
        <p>${state.currentEvent.news}</p>
        ${state.pointsVisible ? `<div class="hidden-points">${points}</div><div class="market-note"><strong>本輪市場解讀</strong><br>${escapeHtml(eventExplanations[state.currentEvent.id] || "")}</div>` : ""}
      `;
    }

    function renderCards() {
      const cards = state.players.flatMap((player) => {
        if (!player.cards.length) return [];
        return player.cards.map((card) => ({ ...card, owner: player.name }));
      });

      if (!cards.length) {
        $("cardsArea").innerHTML = `<div class="empty">尚未抽卡。每輪按「抽卡」後，四位玩家會各得到一張卡。</div>`;
        return;
      }

      $("cardsArea").innerHTML = cards.map((card) => `
        <article class="board-card draw-card ${card.type}">
          <div class="card-owner">${escapeHtml(card.owner)}</div>
          <div class="card-type">${escapeHtml(card.title)}</div>
          <div class="card-text">${escapeHtml(card.text)}</div>
          <span class="private-note">${escapeHtml(card.note)}</span>
        </article>
      `).join("");
    }

    function renderAdjustments() {
      $("adjustmentsArea").innerHTML = state.players.map((player) => `
        <div class="adjust-player">
          <h3>${escapeHtml(player.name)}</h3>
          <div class="adjust-inputs">
            ${products.map((product) => `
              <div class="field">
                <label>${product.name}（+買 / -賣）</label>
                <input type="number" step="1" value="0" data-adjust="${player.id}-${product.key}" />
              </div>
            `).join("")}
          </div>
        </div>
      `).join("");
    }

    function renderLeaderboard() {
      const sorted = [...state.players].sort((a, b) => totalAssets(b) - totalAssets(a));
      $("leaderboardArea").innerHTML = sorted.map((player, index) => `
        <div class="leader-row ${index === 0 ? "first" : ""}">
          <strong>#${index + 1}</strong>
          <span>${escapeHtml(player.name)}</span>
          <strong>${totalAssets(player)} 點</strong>
        </div>
      `).join("");
    }

    function renderRecords() {
      if (!state.records.length) {
        $("recordsArea").innerHTML = `<div class="empty">尚無結算紀錄。</div>`;
        return;
      }

      $("recordsArea").innerHTML = state.records.map((record) => {
        const points = products.map((product) => `${product.name} ${signed(record.event.points[product.key])}`).join("、");
        const results = record.playerResults.map((result) =>
          `${escapeHtml(result.playerName)}：盈虧 <span class="${classByNumber(result.profit)}">${signed(result.profit)}</span>，總資產 ${result.assetsAfter}`
        ).join("<br>");
        return `
          <article class="record-item">
            <h3>第 ${record.round} 輪：${record.event.title}</h3>
            <div>商品點數：${points}</div>
            <div>${results}</div>
          </article>
        `;
      }).join("");
    }

    function renderFinal() {
      const shouldShow = state.stage === "遊戲結束";
      $("finalArea").style.display = shouldShow ? "block" : "none";
      if (!shouldShow) return;

      const ranked = [...state.players].sort((a, b) => totalAssets(b) - totalAssets(a));
      const rankingHtml = ranked.map((player, index) => `
        <div class="leader-row ${index === 0 ? "first" : ""}">
          <strong>#${index + 1}</strong>
          <span>${escapeHtml(player.name)}</span>
          <strong>${totalAssets(player)} 點</strong>
        </div>
      `).join("");

      const histories = state.players.map((player) => `
        <div class="history-block">
          <strong>${escapeHtml(player.name)} 投資紀錄</strong><br>
          ${player.history.length ? player.history.map(escapeHtml).join("<br>") : "尚無紀錄"}
        </div>
      `).join("");

      $("finalContent").innerHTML = `
        ${rankingHtml}
        <p>本遊戲中的新聞事件皆為模擬情境，參考現實市場常見的投資邏輯改寫而成，並不代表真實投資建議。商品點數為遊戲平衡設計，並非對任何股票、產業或 ETF 的實際預測。</p>
        <p>投資結果不只取決於運氣，也受到資訊取得、風險分散、同儕討論、謠言判斷與決策紀律影響。資產最高者可能承擔較高風險，資產較低者也可能在某些回合做出良好的判斷。</p>
        ${histories}
      `;
    }

    function updateButtonStates() {
      $("drawEventBtn").disabled = !state.round || Boolean(state.currentEvent);
      $("togglePointsBtn").disabled = !state.currentEvent;
      $("drawCardsBtn").disabled = !state.currentEvent || state.cardsDrawn;
      $("settleBtn").disabled = !state.currentEvent || Boolean(state.settledRounds[state.round]);
      $("nextRoundBtn").disabled = !state.round || !state.settledRounds[state.round] || state.stage === "遊戲結束";
      $("endGameBtn").disabled = state.stage === "遊戲結束";
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    // =============================
    // 事件綁定
    // =============================

    $("initBtn").addEventListener("click", initializeGame);
    $("setNamesBtn").addEventListener("click", applyPlayerNames);
    $("showBigEventBtn").addEventListener("click", showBigEvent);
    $("startRoundBtn").addEventListener("click", startRound);
    $("drawEventBtn").addEventListener("click", drawSmallEvent);
    $("togglePointsBtn").addEventListener("click", togglePoints);
    $("drawCardsBtn").addEventListener("click", drawCards);
    $("timerBtn").addEventListener("click", startTimer);
    $("applyAdjustmentsBtn").addEventListener("click", applyAdjustments);
    $("settleBtn").addEventListener("click", settleRound);
    $("nextRoundBtn").addEventListener("click", nextRound);
    $("endGameBtn").addEventListener("click", endGame);
    $("resetBtn").addEventListener("click", resetGame);

    render();
  </script>
</body>
</html>
